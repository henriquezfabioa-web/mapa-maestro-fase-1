<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa Maestro · Fase 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Mundo único: papel de valores (bono / certificado) — tinta azul, pátina verde, latón. Libro a doble página. */
  --ink:#13263b;        /* azul tinta: portadas, títulos */
  --paper:#f1f0eb;      /* papel neutro, ligeramente cálido */
  --paper-2:#e6e4dc;    /* papel de recuadros */
  --text:#1d2833;
  --muted:#5a6570;
  --patina:#2f7469;     /* acento principal */
  --brass:#a8823a;      /* filetes, folios, detalles */
  --rule:#cfcabd;
  --s0:#737a82; --s1:#2d5f8f; --s2:#9a6f22; --s3:#2f7469;
  --display:'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
  --body:'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --PW:500px; --PH:707px;
  color-scheme: light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#1a2430;background-image:radial-gradient(ellipse at 50% 40%, #2a3846 0%, #121a23 75%);font-family:var(--body);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0 0 64px 0;display:flex;align-items:center;justify-content:center}
#scaler{transform-origin:center center}
#book{position:relative;width:calc(var(--PW)*2);height:var(--PH);transition:transform .6s cubic-bezier(.3,.7,.2,1);}
.leaf{position:absolute;top:0;left:var(--PW);width:var(--PW);height:var(--PH);transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.35,.65,.25,1);cursor:pointer}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
#shadow{position:absolute;top:0;bottom:0;left:0;right:0;box-shadow:0 26px 56px rgba(0,0,0,.42);transition:left .6s,right .6s;pointer-events:none}
.cover .ft{width:100%;text-align:left}
.face.back{transform:rotateY(180deg)}
.face.front::after,.face.back::after{content:"";position:absolute;top:0;bottom:0;width:38px;pointer-events:none}
.face.front::after{left:0;background:linear-gradient(90deg,rgba(0,0,0,.16),rgba(0,0,0,0))}
.face.back::after{right:0;background:linear-gradient(270deg,rgba(0,0,0,.16),rgba(0,0,0,0))}
#single{position:relative;width:var(--PW);height:var(--PH);display:none;box-shadow:0 30px 60px rgba(0,0,0,.45)}
#single .sp{position:absolute;inset:0;opacity:0;transform:translateX(24px);transition:opacity .35s, transform .35s;pointer-events:none}
#single .sp.on{opacity:1;transform:none;pointer-events:auto}

/* ---------- Página ---------- */
.pg{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;padding:26px 36px 0 36px;font-size:10.6px;line-height:1.45;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .2 0 0 0 0 .18 0 0 0 0 .15 0 0 0 .07 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.pg.dark{background-color:var(--ink);color:#e9e6dc}
.pg .hd{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:7.6px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-bottom:7px;border-bottom:.75px solid var(--rule)}
.pg .hd b{color:var(--brass);font-weight:500}
.pg .body{flex:1;display:flex;flex-direction:column;gap:11px;padding-top:16px;min-height:0}
.pg .ft{margin-top:auto;padding:8px 0 14px;border-top:.75px solid var(--rule);display:flex;flex-direction:column;gap:3px}
.pg.dark .ft,.pg.dark .hd{border-color:rgba(233,230,220,.22)}
.ft .row1{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:7.4px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pg.dark .ft .row1{color:#b9b4a6}
.ft .folio{font-family:var(--display);font-size:13px;letter-spacing:0;color:var(--brass);font-weight:600}
.ft .cargo{font-family:var(--body);font-size:7.6px;white-space:nowrap;overflow:hidden;color:var(--ink);font-weight:500;letter-spacing:.01em}
.pg.dark .ft .cargo{color:#efe9da}
.ft .cargo i{font-style:normal;color:var(--brass);padding:0 .45em;font-weight:400}
.pg.even .ft .row1{flex-direction:row-reverse}

.kicker{font-family:var(--mono);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--patina);font-weight:500}
.pg.dark .kicker{color:#c9a65a}
h2{font-family:var(--display);font-weight:600;font-size:29px;line-height:1.04;color:var(--ink);letter-spacing:-.01em;text-wrap:balance}
h2 em{font-style:italic;font-weight:500;color:var(--patina)}
.pg.dark h2{color:#f4efe2}
h3{font-family:var(--display);font-weight:700;font-size:13.5px;line-height:1.15;color:var(--ink)}
.pg.dark h3{color:#f4efe2}
.lead{font-size:11.6px;line-height:1.45;color:var(--text);max-width:40em}
.lead::first-letter{}
p{max-width:44em}
.muted{color:var(--muted)}
.small{font-size:9.2px;line-height:1.4}
.note{font-size:8.6px;color:var(--muted);line-height:1.4}
.mono{font-family:var(--mono)}
.rule{height:.75px;background:var(--rule)}
.cols{display:grid;gap:12px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}
.box{background:var(--paper-2);border:.75px solid var(--rule);border-radius:3px;padding:9px 11px;display:flex;flex-direction:column;gap:4px}
.box.hl{background:var(--ink);color:#ece7da;border-color:var(--ink)}
.box.hl h3{color:#f4efe2}
.box.pat{border-left:3px solid var(--patina)}
ul.l{list-style:none;display:flex;flex-direction:column;gap:3px}
ul.l li{padding-left:11px;position:relative}
ul.l li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:.75px;background:var(--brass)}
ol.n{list-style:none;counter-reset:n;display:flex;flex-direction:column;gap:4px}
ol.n li{counter-increment:n;padding-left:19px;position:relative}
ol.n li::before{content:counter(n);position:absolute;left:0;top:-1px;font-family:var(--display);font-weight:700;color:var(--brass);font-size:12px}
table.t{width:100%;border-collapse:collapse;font-size:9px;line-height:1.35}
table.t th{text-align:left;font-family:var(--mono);font-weight:500;font-size:7.4px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:4px 5px;border-bottom:1px solid var(--ink)}
table.t td{padding:4px 5px;border-bottom:.75px solid var(--rule);vertical-align:top}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.tot td{font-weight:600;border-bottom:1px solid var(--ink)}
.pill{display:inline-block;font-family:var(--mono);font-size:7.6px;letter-spacing:.06em;padding:1.5px 6px;border-radius:9px;color:#fff;white-space:nowrap;vertical-align:middle}
.st0{background:var(--s0)}.st1{background:var(--s1)}.st2{background:var(--s2)}.st3{background:var(--s3)}
.role{display:inline-block;font-family:var(--mono);font-size:7.4px;letter-spacing:.06em;text-transform:uppercase;padding:1.5px 6px;border-radius:2px;border:.75px solid currentColor;white-space:nowrap}
.r-lead{color:#fff;background:var(--patina);border-color:var(--patina)}
.r-rev{color:var(--s1)}.r-no{color:var(--s0)}.r-neg{color:var(--s2)}
.quote{font-family:var(--display);font-style:italic;font-size:17px;line-height:1.25;color:var(--ink);border-left:2px solid var(--brass);padding-left:12px}
.pg.dark .quote{color:#f4efe2}
.big{font-family:var(--display);font-weight:700;font-size:44px;line-height:.95;color:var(--ink);font-variant-numeric:lining-nums}
.tile{border-top:1.5px solid var(--ink);padding-top:6px;display:flex;flex-direction:column;gap:3px}
.say{background:#fbfaf6;border:.75px solid var(--rule);border-left:3px solid var(--patina);padding:6px 9px;font-size:9.6px;line-height:1.4}
.say .en{font-style:italic;color:var(--ink)}
.say .es{color:var(--muted);font-size:8.8px}
.chev{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.chev div{background:var(--ink);color:#ece7da;padding:8px 14px 8px 10px;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,0 100%,6px 50%);display:flex;flex-direction:column;gap:2px;min-height:62px}
.chev div:first-child{clip-path:polygon(0 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,0 100%)}
.chev b{font-family:var(--display);font-size:11.5px;color:#f4efe2}
.chev span{font-size:8.4px;line-height:1.3;color:#c9c3b3}
.stackbar{display:flex;height:16px;border-radius:2px;overflow:hidden}
.stackbar div{display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--mono);font-size:7.6px}
.bars{display:flex;flex-direction:column;gap:6px}
.bars .r{display:grid;grid-template-columns:176px 1fr 66px;gap:8px;align-items:center;font-size:9px}
.bars .r .lab{text-align:right;line-height:1.2}
.bars .r .tr{height:11px;background:transparent;position:relative}
.bars .r .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--s1);border-radius:1px}
.bars .r .tr i.eur{background:var(--brass)}
.bars .r .v{font-family:var(--mono);font-size:8.6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ficha{border:.75px solid var(--rule);background:#fbfaf6;border-radius:3px;padding:7px 10px;display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
.ficha .top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:.75px solid var(--rule);padding-bottom:5px;margin-bottom:2px}
.ficha .code{font-family:var(--mono);font-size:7.8px;color:var(--brass);letter-spacing:.08em}
.ficha .amt{font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink);white-space:nowrap}
.ficha dt{font-family:var(--mono);font-size:7.2px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ficha dd{font-size:8.9px;line-height:1.3}
.ficha .smart{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:1px 8px;background:var(--ink);color:#ece7da;padding:5px 9px;border-radius:2px;margin-top:3px;font-size:8.7px;line-height:1.3}
.ficha .smart b{font-family:var(--display);color:#c9a65a;font-size:11px}
.chain{display:flex;flex-direction:column}
.chain .st{display:grid;grid-template-columns:20px 1fr 88px;gap:8px;align-items:start;padding:5px 0;border-bottom:.75px solid var(--rule)}
.chain .st .k{font-family:var(--display);font-weight:700;font-size:14px;color:var(--brass);line-height:1}
.chain .st h3{font-size:11.5px}
.chain .st p{font-size:8.9px;line-height:1.35;color:var(--muted)}
.chain .st .rcol{text-align:right}
.scn{display:flex;flex-direction:column;gap:7px}
.scn .s{display:grid;grid-template-columns:1fr 1.25fr;gap:10px;border-top:.75px solid var(--rule);padding-top:6px}
.scn .s h3{font-size:11.5px}
.scn .s .m{font-size:8.9px;color:var(--muted);line-height:1.35}
.phase{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1.5px solid var(--ink)}
.phase>div{padding:7px 8px 8px;border-right:.75px solid var(--rule);display:flex;flex-direction:column;gap:3px}
.phase>div:last-child{border-right:none}
.phase .d{font-family:var(--mono);font-size:7.6px;color:var(--brass);letter-spacing:.06em}
.gate{display:flex;justify-content:space-between;align-items:center;padding:0 2px}
.gate span{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:8px;color:var(--ink)}
.gate span::before{content:"";width:9px;height:9px;background:var(--patina);transform:rotate(45deg)}
.check{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;font-size:9.2px}
.check li{padding-left:14px;position:relative;line-height:1.3}
.check li::before{content:"";position:absolute;left:0;top:2px;width:8px;height:8px;border:.75px solid var(--ink);border-radius:1px}
.toc{display:flex;flex-direction:column}
.toc a{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:8px;padding:3.5px 0;border-bottom:.75px solid var(--rule);color:inherit;text-decoration:none;font-size:10.2px;cursor:pointer}
.toc a:hover{color:var(--patina)}
.toc a .pn{font-family:var(--display);font-weight:700;color:var(--brass);font-size:12px}
.toc .sec{font-family:var(--mono);font-size:7.4px;letter-spacing:.14em;text-transform:uppercase;color:var(--patina);padding:8px 0 2px}
.tocg{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.sig{font-family:var(--display);font-style:italic;font-size:16px;color:var(--ink)}

/* Portadas */
.cover{padding:0;overflow:hidden}
.cover canvas{position:absolute;inset:0;width:100%;height:100%}
.cover .in{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;padding:30px 36px 0}
.mast{font-family:var(--display);font-weight:800;font-size:76px;line-height:.86;letter-spacing:-.02em;color:#f6f1e3}
.mast em{font-style:italic;font-weight:500;color:#c9a65a}
.cover .coverlines{display:flex;flex-direction:column;gap:9px;max-width:230px}
.cover .coverlines div{border-top:.75px solid rgba(233,230,220,.35);padding-top:5px;font-size:9.6px;line-height:1.35;color:#d9d3c3}
.cover .coverlines b{display:block;font-family:var(--display);font-size:13px;color:#f4efe2;font-weight:600}
.seal{width:84px;height:84px;border-radius:50%;border:1px solid #c9a65a;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--mono);font-size:6.8px;letter-spacing:.12em;color:#c9a65a;text-transform:uppercase;line-height:1.5;background:rgba(19,38,59,.6)}

/* Barra de herramientas */
#bar{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px;color:#e8e4d8;font-family:var(--body);font-size:13px}
#bar button,#bar select{font:inherit;color:#f1ede2;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:6px;height:36px;padding:0 12px;cursor:pointer}
#bar button:hover,#bar select:hover{background:rgba(255,255,255,.14)}
#bar button:focus-visible,#bar select:focus-visible,.toc a:focus-visible{outline:2px solid #c9a65a;outline-offset:2px}
#bar select option{color:#13263b}
#count{min-width:150px;text-align:center;font-family:var(--mono);font-size:12px;color:#cfc9b9}
#bar .arrow{width:44px;font-size:18px;padding:0}
@media (max-width:640px){#bar .opt{display:none}#count{min-width:96px}}
@media (prefers-reduced-motion:reduce){.leaf,#book,#single .sp{transition:none!important}}
</style>
</head>
<body>
<div id="stage"><div id="scaler"><div id="book" aria-live="polite"><div id="shadow"></div></div><div id="single"></div></div></div>
<nav id="bar" aria-label="Navegación de la revista">
  <button class="arrow" id="prev" aria-label="Página anterior">‹</button>
  <span id="count">Portada</span>
  <button class="arrow" id="next" aria-label="Página siguiente">›</button>
  <select id="jump" class="opt" aria-label="Ir a la sección"></select>
  <button id="mode" class="opt" aria-label="Cambiar vista">Una página</button>
  <button id="fs" class="opt" aria-label="Pantalla completa">Pantalla completa</button>
</nav>
<script>
const CARGO = ['Multijurisdictional Due Diligence','Corporate Alignment','Business Strategy','Communication','Risk & Positioning'];
const P = [];
const add = (sec, html, opt={}) => P.push(Object.assign({sec, html}, opt));

/* 0 · PORTADA */
add('Portada', `
<canvas class="guil"></canvas>
<div class="in">
  <div class="kicker" style="color:#c9a65a">HEART DEVELOPMENT · N.A.T. Holdings AG</div>
  <div style="height:22px"></div>
  <div class="mast">Mapa<br>Maestro<br><em>Fase&nbsp;1</em></div>
  <p style="margin-top:16px;font-family:var(--display);font-size:16px;line-height:1.3;color:#e9e3d2;max-width:320px">Due diligence, estructura y gobierno de un portafolio de 64 iniciativas en 21 países</p>
  <div style="flex:1"></div>
  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-bottom:16px">
    <div class="coverlines">
      <div><b>N.A.T.: la holding por diseñar</b>Por qué ahí se decide la inversión</div>
      <div><b>Quién dirige qué</b>Las 11 etapas de cada proyecto</div>
      <div><b>Cómo actuar y cómo hablar</b>Escenarios, frases, honorarios y gastos</div>
    </div>
    <div class="seal">Confidencial<br>Documento<br>de trabajo<br>Nov · 2026</div>
  </div>
</div>`, {dark:true, cover:true});

/* 1 · ÍNDICE */
add('Índice', `
<div class="kicker">En esta edición</div>
<h2>Índice</h2>
<div class="tocg">
<div class="toc">
  <div class="sec">El portafolio</div>
  <a data-go="2">Carta del asesor<span class="pn">2</span></a>
  <a data-go="3">El portafolio en cifras<span class="pn">3</span></a>
  <a data-go="4">Dónde está el capital<span class="pn">4</span></a>
  <a data-go="5">El tablero de actores<span class="pn">5</span></a>
  <a data-go="6">N.A.T. I · La pieza central<span class="pn">6</span></a>
  <a data-go="7">N.A.T. II · La holding<span class="pn">7</span></a>
  <a data-go="8">Priorización<span class="pn">8</span></a>
  <a data-go="9">Prioridad 1 · fichas SMART<span class="pn">9</span></a>
  <a data-go="11">Diez condiciones de holding<span class="pn">11</span></a>
</div>
<div class="toc">
  <div class="sec">El proceso</div>
  <a data-go="12">Quién dirige qué<span class="pn">12</span></a>
  <a data-go="13">La cadena de once etapas<span class="pn">13</span></a>
  <a data-go="14">Su rol: cuatro escenarios<span class="pn">14</span></a>
  <a data-go="15">Las reuniones<span class="pn">15</span></a>
  <a data-go="16">Agenda de 90 días<span class="pn">16</span></a>
  <a data-go="17">Cuándo entra usted<span class="pn">17</span></a>
  <div class="sec">El asesor</div>
  <a data-go="18">Cómo pensar y actuar<span class="pn">18</span></a>
  <a data-go="19">Cómo hablar<span class="pn">19</span></a>
  <a data-go="20">Escenarios bajo presión<span class="pn">20</span></a>
  <a data-go="22">Riesgo y posicionamiento<span class="pn">22</span></a>
  <a data-go="23">Honorarios y gastos<span class="pn">23</span></a>
  <a data-go="24">Formación y herramientas<span class="pn">24</span></a>
  <a data-go="26">Decisiones y reglas de oro<span class="pn">26</span></a>
</div>
</div>
<div style="flex:1"></div>
<p class="quote">Un catálogo de oportunidades no es todavía una cartera de inversiones verificadas.</p>
<p class="note">Base: dossier HEART DEVELOPMENT del 6 de noviembre de 2026. Reuniones, fechas y objetivos son propuestas de gestión. Arranque supuesto: 16 de noviembre de 2026.</p>`);

/* 2 · CARTA */
add('Carta del asesor', `
<div class="kicker">Carta del asesor</div>
<h2>Un catálogo <em>no es</em> una cartera</h2>
<p class="lead">El 6 de noviembre de 2026, HEART DEVELOPMENT presentó a George Cutts un dossier con 64 iniciativas en 21 países: vivienda prefabricada, minería, industria, agroindustria, salud e infraestructura.</p>
<p>Solo una reporta contrato firmado. El resto son oportunidades por calificar, conceptos o negociaciones en curso. Esa es la realidad de partida y el lugar donde empieza el trabajo.</p>

/* ---------- Construcción ---------- */
const N = P.length, L = N/2; let swiped=false;
const book = document.getElementById('book'), single = document.getElementById('single');
const cargoHTML = CARGO.map(c=>`<span>${c}</span>`).join('<i>|</i>');
function pageNode(i){
  const p = P[i];
  const d = document.createElement('div');
  d.className = 'pg' + (p.dark?' dark':'') + (p.cover?' cover':'') + (i%2? ' even':' odd');
  const head = p.cover ? '' : `<div class="hd"><span><b>Mapa Maestro</b> · Fase 1</span><span>${p.sec}</span></div>`;
  const foot = `<div class="ft"><div class="row1"><span>Fabio Henríquez G. · Arquitectura Legal</span><span class="folio">${i===0?'':i}</span></div><div class="cargo"><i>|</i>${cargoHTML}</div></div>`;
  if (p.cover){
    d.innerHTML = p.html;
    const inn = d.querySelector('.in'); inn.insertAdjacentHTML('beforeend', foot);
  } else {
    d.innerHTML = head + `<div class="body">${p.html}</div>` + foot;
  }
  return d;
}
const leaves = [];
for (let j=0;j<L;j++){
  const lf = document.createElement('div'); lf.className='leaf';
  const f = document.createElement('div'); f.className='face front'; f.appendChild(pageNode(2*j));
  const b = document.createElement('div'); b.className='face back'; b.appendChild(pageNode(2*j+1));
  lf.append(f,b); book.appendChild(lf); leaves.push(lf);
  lf.addEventListener('click', e => { if (swiped || e.target.closest('a[data-go]')) return; lf.classList.contains('flipped') ? go(cur-1) : go(cur+1); });
}
const sps = P.map((_,i)=>{ const s=document.createElement('div'); s.className='sp'; s.appendChild(pageNode(i)); single.appendChild(s); s.addEventListener('click', e=>{ if (swiped || e.target.closest('a[data-go]')) return; const r=s.getBoundingClientRect(); (e.clientX - r.left) > r.width*0.35 ? gs(sp+1) : gs(sp-1); }); return s; });

/* Guilloche: patrón de papel de valores */
function guil(cv){
  const W=1000,H=1414; cv.width=W; cv.height=H; const x=cv.getContext('2d');
  x.fillStyle='#13263b'; x.fillRect(0,0,W,H);
  const g=x.createRadialGradient(W*.72,H*.36,40,W*.72,H*.36,W*.9); g.addColorStop(0,'rgba(47,116,105,.35)'); g.addColorStop(1,'rgba(19,38,59,0)'); x.fillStyle=g; x.fillRect(0,0,W,H);
  const cx=W*.72, cy=H*.36;
  x.lineWidth=.9;
  for(let k=0;k<46;k++){
    x.beginPath();
    const R=150+k*9.5, amp=14+ (k%5)*3, f1=18, f2=7, ph=k*.21;
    for(let t=0;t<=Math.PI*2+.01;t+=.004){
      const r=R+amp*Math.sin(f1*t+ph)+amp*.6*Math.cos(f2*t-ph);
      const px=cx+r*Math.cos(t), py=cy+r*Math.sin(t);
      t===0?x.moveTo(px,py):x.lineTo(px,py);
    }
    x.strokeStyle = k%7===0 ? 'rgba(201,166,90,.42)' : 'rgba(201,166,90,.13)';
    x.stroke();
  }
  for(let k=0;k<60;k++){ x.beginPath(); const y0=H*.78+k*6.5; for(let px=0;px<=W;px+=4){ const py=y0+6*Math.sin(px/38+k*.4)+3*Math.sin(px/11-k); px===0?x.moveTo(px,py):x.lineTo(px,py);} x.strokeStyle='rgba(201,166,90,.07)'; x.stroke(); }
}
document.querySelectorAll('canvas.guil').forEach(guil);

/* Estado */
let cur=0, sp=0, mode='spread', userSingle=false;
function zfix(){ leaves.forEach((lf,j)=>{ lf.style.zIndex = (j<cur) ? (j+1) : (L-j+1); }); }
function render(){
  leaves.forEach((lf,j)=> lf.classList.toggle('flipped', j<cur));
  const off = cur===0 ? -250 : (cur===L ? 250 : 0);
  book.style.transform = `translateX(${off}px)`;
  const sh=document.getElementById('shadow'); sh.style.left = cur===0?'500px':'0'; sh.style.right = cur===L?'500px':'0';
  label();
}
function label(){
  let t;
  if (mode==='spread'){
    if (cur===0) t='Portada';
    else if (cur===L) t='Contraportada';
    else t=`Páginas ${2*cur-1}–${2*cur} de ${N-1}`;
  } else t = sp===0 ? 'Portada' : (sp===N-1 ? 'Contraportada' : `Página ${sp} de ${N-1}`);
  document.getElementById('count').textContent=t;
  const pi = mode==='spread' ? (cur===0?0:(cur===L?N-1:2*cur-1)) : sp;
  const j=document.getElementById('jump'); if(j && j.options.length){ let v=0; for(const o of j.options){ if(+o.value<=pi) v=o.value; } j.value=v; }
}
function go(n){
  n=Math.max(0,Math.min(L,n)); if(n===cur) return;
  const j = n>cur ? cur : cur-1;
  leaves[j].style.zIndex = L+10;
  cur=n; render();
  setTimeout(zfix, 920);
}
function gs(n){ n=Math.max(0,Math.min(N-1,n)); sps[sp].classList.remove('on'); sp=n; sps[sp].classList.add('on'); label(); }
zfix(); render(); sps[0].classList.add('on');

/* Escala y modo */
function layout(){
  const vw=innerWidth, vh=innerHeight-64;
  const want = (vw<760 || userSingle) ? 'single' : 'spread';
  if (want!==mode){
    if (want==='single'){ sps[sp].classList.remove('on'); sp = cur===0?0:(cur===L? N-1 : 2*cur-1); sps[sp].classList.add('on'); }
    else { cur = sp===0?0:Math.floor((sp+1)/2); zfix(); render(); }
    mode=want;
  }
  book.style.display = mode==='spread'?'block':'none';
  single.style.display = mode==='single'?'block':'none';
  const sc = document.getElementById('scaler');
  let s;
  if (mode==='spread'){ s=Math.min((vw-40)/1000,(vh-24)/707); sc.style.width='1000px'; }
  else { s=Math.min((vw-20)/500,(vh-20)/707); sc.style.width='500px'; }
  sc.style.transform=`scale(${s})`;
  document.getElementById('mode').textContent = mode==='spread' ? 'Una página' : 'Doble página';
  label(); fitCargo();
}
function fitCargo(){
  document.querySelectorAll('.ft .cargo').forEach(el=>{
    let fs=7.6; el.style.fontSize=fs+'px';
    let guard=0; while(el.scrollWidth>el.clientWidth+0.5 && guard++<20){ fs-=.15; el.style.fontSize=fs+'px'; }
  });
}
addEventListener('resize', layout);
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(layout);
layout();

/* Controles */
const next=()=> mode==='spread'?go(cur+1):gs(sp+1);
const prev=()=> mode==='spread'?go(cur-1):gs(sp-1);
document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;
document.getElementById('mode').onclick=()=>{ userSingle=!userSingle; layout(); };
document.getElementById('fs').onclick=async()=>{ try{ document.fullscreenElement ? await document.exitFullscreen() : await document.documentElement.requestFullscreen(); }catch(e){} };
addEventListener('keydown',e=>{ if(e.target.tagName==='SELECT') return; if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();next();} else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();} else if(e.key==='Home'){mode==='spread'?go(0):gs(0);} else if(e.key==='End'){mode==='spread'?go(L):gs(N-1);} });
let sx=null; addEventListener('pointerdown',e=>{sx=e.clientX}); addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>60){ swiped=true; setTimeout(()=>swiped=false,350); dx<0?next():prev(); }});
const jump=document.getElementById('jump');
const secs=[]; P.forEach((p,i)=>{ if(!secs.find(s=>s.sec===p.sec)) secs.push({sec:p.sec,i}); });
jump.innerHTML = secs.map(s=>`<option value="${s.i}">${s.sec}</option>`).join('');
jump.onchange=()=>{ jumpTo(+jump.value); };
function jumpTo(p){ if(mode==='spread'){ const n=p===0?0:Math.floor((p+1)/2); cur=n; zfix(); render(); } else gs(p); }
document.addEventListener('click',e=>{ const a=e.target.closest('a[data-go]'); if(!a) return; e.preventDefault(); e.stopPropagation(); jumpTo(+a.dataset.go); }, true);
document.querySelectorAll('a[data-go]').forEach(a=>{ a.setAttribute('href','#'); });
</script>
